<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KK Trade Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0f1115;--card:#171a21;--card2:#1e222b;--line:#2a2f3a;--line2:#39404e;
  --tx:#e6e9ef;--tx2:#98a1b3;--tx3:#6b7483;--acc:#4c8dff;--accbg:#16233a;
  --up:#26a86a;--dn:#e4544f;--warn:#e0a03a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
body.light{--bg:#f5f6f8;--card:#fff;--card2:#f0f2f5;--line:#e2e5ea;--line2:#cfd4dc;--tx:#13161b;--tx2:#5b6472;--tx3:#8a93a1;--accbg:#e8f0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.5;padding-bottom:64px}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.ttl{font-size:14px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx3);display:inline-block;margin-right:6px}
.dot.on{background:var(--up)}.dot.off{background:var(--dn)}
.age{font-size:11px;color:var(--tx3)}
.body{padding:12px 14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.kpi{background:var(--card2);border-radius:10px;padding:9px}
.kpi .l{font-size:10.5px;color:var(--tx2)}.kpi .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;font-size:13px}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--tx2)}.b{font-weight:600}
pre{font-family:var(--mono);font-size:11px;white-space:pre;overflow-x:auto;background:var(--bg);border-radius:7px;padding:7px 9px;margin:6px 0}
.btns{display:grid;gap:6px;margin-top:9px}
.b2{grid-template-columns:repeat(2,1fr)}.b3{grid-template-columns:repeat(3,1fr)}
button{font-family:var(--sans);font-size:12.5px;padding:9px 4px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);cursor:pointer}
button:active{opacity:.7}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.dang{border-color:var(--dn);color:var(--dn)}
.sl{margin:12px 0}
.sl label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2);margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=number],input[type=text]{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);font-family:var(--mono);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lv{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;padding:5px 9px;border-radius:7px;background:var(--card2);margin-bottom:4px}
.seg{display:flex;gap:5px;margin-bottom:10px}
.seg button{flex:1}
.seg button[aria-selected="true"]{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;color:var(--tx3);padding:9px 2px;font-size:10.5px;border-radius:0}
.tabs button[aria-selected="true"]{color:var(--acc)}
.tabs .ic{display:block;font-size:16px;line-height:1.25}
.toast{position:fixed;left:14px;right:14px;bottom:70px;background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.sw{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border-radius:10px;padding:10px 12px;margin-bottom:7px;font-size:13px}
.knob{width:38px;height:21px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;flex:0 0 auto}
.knob.on{background:var(--acc)}
.knob i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s}
.knob.on i{left:19px}
.warn{background:var(--accbg);border:1px solid var(--acc);color:var(--tx);border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:10px}
</style>
</head>
<body>
<div class="top">
  <div><span class="dot" id="dot"></span><span class="ttl">KK Trade Panel</span></div>
  <div class="age" id="age">connecting…</div>
</div>
<div class="body" id="scr"></div>
<div class="toast" id="toast"></div>
<div class="tabs" id="tabs">
  <button aria-selected="true" data-t="home"><span class="ic">🏠</span>Home</button>
  <button aria-selected="false" data-t="new"><span class="ic">▦</span>New grid</button>
  <button aria-selected="false" data-t="open"><span class="ic">📈</span>Open</button>
  <button aria-selected="false" data-t="stats"><span class="ic">📊</span>Stats</button>
  <button aria-selected="false" data-t="set"><span class="ic">⚙</span>Settings</button>
</div>

<script>
// Nothing to edit here. The first time you open the page it asks for your
// relay URL and app key, then remembers them on this device.
let RELAY = "";
let KEY   = "";
try {
  RELAY = localStorage.getItem("kktp_relay") || "";
  KEY   = localStorage.getItem("kktp_key") || "";
} catch (e) {}

function saveSetup() {
  const r = document.getElementById("su_url").value.trim().replace(/\/+$/, "");
  const k = document.getElementById("su_key").value.trim();
  if (!r.startsWith("https://")) return toast("the URL has to start with https://");
  if (k.length < 8) return toast("paste your APP_KEY");
  try {
    localStorage.setItem("kktp_relay", r);
    localStorage.setItem("kktp_key", k);
  } catch (e) { return toast("this browser blocks storage"); }
  RELAY = r; KEY = k;
  toast("saved");
  pull();
}

function forgetSetup() {
  try { localStorage.removeItem("kktp_relay"); localStorage.removeItem("kktp_key"); } catch (e) {}
  RELAY = ""; KEY = "";
  render();
}

function setupScreen() {
  return `<div class="row"><b>One-time setup</b>
    <div class="mut" style="font-size:12.5px;margin:6px 0 10px">
      Paste the two things from your Cloudflare Worker. They stay on this device only.
    </div>
    <label class="mut" style="font-size:12px">Worker URL</label>
    <input type="text" id="su_url" placeholder="https://kk-panel.yourname.workers.dev" value="${RELAY}">
    <div style="height:8px"></div>
    <label class="mut" style="font-size:12px">APP_KEY</label>
    <input type="text" id="su_key" placeholder="the APP_KEY secret" value="${KEY}">
    <div class="btns"><button class="pri" onclick="saveSetup()">Save and connect</button></div>
  </div>
  <div class="row mut" style="font-size:12px">
    Worker URL: Cloudflare dashboard → your Worker → the address at the top.<br>
    APP_KEY: the secret you created under Settings → Variables and Secrets.
  </div>`;
}

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); if (tg.colorScheme === "light") document.body.classList.add("light"); }

let S = null, online = false, tab = "home";

const $ = (id) => document.getElementById(id);
const n2 = (v) => (v == null ? "—" : Number(v).toFixed(2));
const sgn = (v) => (v == null ? "—" : (v >= 0 ? "+" : "") + Number(v).toFixed(2));
const cls = (v) => (v >= 0 ? "up" : "dn");

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

async function pull() {
  if (!RELAY || !KEY) {
    $("dot").className = "dot";
    $("age").textContent = "setup needed";
    render();
    return;
  }
  try {
    const r = await fetch(RELAY + "/state?k=" + encodeURIComponent(KEY), { cache: "no-store" });
    const d = await r.json();
    online = !!d.online;
    S = d.state || null;
    $("dot").className = "dot " + (online ? "on" : "off");
    $("age").textContent = online ? "live · " + (d.age || 0) + "s ago" : (S ? "EA quiet " + d.age + "s" : "no EA");
  } catch (e) {
    online = false;
    $("dot").className = "dot off";
    $("age").textContent = "relay unreachable";
  }
  render();
}

async function cmd(c, note) {
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  try {
    const r = await fetch(RELAY + "/cmd", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ k: KEY, cmd: c }),
    });
    const d = await r.json();
    toast(d.ok ? (note || "sent: " + c) : (d.error || "failed"));
  } catch (e) { toast("could not reach the relay"); }
  setTimeout(pull, 1200);
}

function confirmCmd(c, msg) {
  if (tg && tg.showConfirm) tg.showConfirm(msg, (ok) => { if (ok) cmd(c); });
  else if (confirm(msg)) cmd(c);
}

// ─── screens ─────────────────────────────────────────────────────────
function home() {
  if (!S) return `<div class="row mut">Waiting for the EA. Check MT5 is running and the relay URL is in the inputs.</div>`;
  const g = S.grid;
  let h = "";
  if (S.dry) h += `<div class="warn">DRY RUN — nothing reaches the broker.</div>`;
  if (S.locked) h += `<div class="warn">🔒 Grids locked: the daily loss limit was hit.</div>`;
  h += `<div class="kpis">
    <div class="kpi"><div class="l">Balance</div><div class="v">${n2(S.bal)}</div></div>
    <div class="kpi"><div class="l">Today</div><div class="v ${cls(S.day)}">${sgn(S.day)}</div></div>
    <div class="kpi"><div class="l">Floating</div><div class="v ${cls(S.float)}">${sgn(S.float)}</div></div>
  </div>`;
  h += g ? gridRow(g) : `<div class="row mut">No grid running.<div class="btns"><button class="pri" onclick="go('new')">▦ Build one</button></div></div>`;
  h += `<div class="row"><span class="mut">${S.sym}</span> <span class="b">${n2(S.bid)}</span> · ${S.pos} positions · ${n2(S.lots)} lots
    <div class="btns b3">
      <button onclick="cmd('/p')">📋 Positions</button>
      <button onclick="cmd('/chart m15')">📷 Chart</button>
      <button onclick="cmd('/brief now')">☀ Brief</button>
    </div></div>`;
  return h;
}

function gridRow(g) {
  const total = (g.float || 0) + (g.real || 0);
  const stage = ["waiting for TP1", "TP1 done", "TP2 done", "finished"][g.stage] || "";
  const bars = "▰".repeat(g.fills) + "▱".repeat(Math.max(0, g.layers - g.fills));
  const nxt = g.stage === 0 ? g.t1 : g.stage === 1 ? g.t2 : g.t3;
  return `<div class="row">
    <span class="b">${g.buy ? "🔺 BUY" : "🔻 SELL"} GRID · ${g.sym}</span><br>
    ${g.paused ? "⏸ Paused" : g.stage >= 1 ? "🛡 <b>Risk free</b>" : "⚠️ At risk"} · <span class="${cls(total)}">${sgn(total)}</span>
    <span class="mut">(${sgn(g.real)} banked)</span>
    <pre>next  ${n2(nxt)}   ${stage}
avg   ${n2(g.avg)}   sl ${n2(g.sl)}
open  ${n2(g.lots)} lots</pre>
    🧱 ${bars} ${g.fills} of ${g.layers}
    <div class="btns b3">
      <button onclick="cmd('/grid be')">🛡 BE</button>
      <button onclick="cmd('/grid derisk 50')">✂ Derisk</button>
      <button onclick="cmd('/grid ${g.paused ? "resume" : "pause"}')">${g.paused ? "▶ Resume" : "⏸ Pause"}</button>
      <button onclick="cmd('/grid cancel')">🗑 Cancel rest</button>
      <button onclick="cmd('/grid')">💬 Card</button>
      <button class="dang" onclick="confirmCmd('/grid close','Close every grid position?')">✖ Close</button>
    </div></div>`;
}

let side = "SELL";
function newGrid() {
  const bid = S ? S.bid : 0;
  return `<div class="seg">
      <button aria-selected="${side === "SELL"}" onclick="side='SELL';render()">SELL</button>
      <button aria-selected="${side === "BUY"}" onclick="side='BUY';render()">BUY</button>
    </div>
    <div class="two">
      <div><label class="mut" style="font-size:12px">First layer</label><input type="number" id="edge" step="0.01" value="${bid ? bid.toFixed(2) : ""}" oninput="calc()"></div>
      <div><label class="mut" style="font-size:12px">Stop loss</label><input type="number" id="sl" step="0.01" value="${bid ? (side === "SELL" ? bid + 10 : bid - 10).toFixed(2) : ""}" oninput="calc()"></div>
    </div>
    <div class="sl"><label><span>Layers</span><span id="lv">6</span></label>
      <input type="range" id="lay" min="4" max="10" value="6" oninput="calc()"></div>
    <div class="sl"><label><span>Risk</span><span id="rv">5%</span></label>
      <input type="range" id="risk" min="1" max="10" step="0.5" value="5" oninput="calc()"></div>
    <div id="levels"></div>
    <div class="row" id="sum"></div>
    <div class="btns b2">
      <button class="pri" onclick="place()">✔ Preview & place</button>
      <button onclick="cmd('/grid')">⚙ Grid settings</button>
    </div>
    <div class="row mut" style="font-size:12px">The EA rebuilds this preview before anything is placed, so what you see in chat is what goes on.</div>`;
}

function calc() {
  const edge = parseFloat($("edge").value), sl = parseFloat($("sl").value);
  const n = +$("lay").value, risk = +$("risk").value;
  $("lv").textContent = n;
  $("rv").textContent = risk + "%";
  if (!S || !edge || !sl || edge === sl) { $("levels").innerHTML = ""; $("sum").textContent = "Fill in the zone."; return; }

  const buy = sl < edge, span = Math.abs(edge - sl), bal = S.bal, budget = bal * risk / 100;
  const vpu = 100;                                   // gold-style contract, the EA recomputes properly
  const dep = [], wt = [];
  for (let i = 0; i < n - 1; i++) { dep.push(0.8 * i / (n - 2)); wt.push(1 + Math.floor(i / 2)); }
  dep.push(0.9); wt.push(wt[wt.length - 1] + 1);

  let sum = 0;
  for (let i = 0; i < n; i++) sum += wt[i] * (1 - dep[i]) * span * vpu;
  const k = budget / sum;

  let html = "", tot = 0, r = 0;
  for (let i = 0; i < n; i++) {
    const p = buy ? edge - dep[i] * span : edge + dep[i] * span;
    const lot = Math.max(0.01, Math.floor(k * wt[i] * 100) / 100);
    tot += lot; r += lot * Math.abs(p - sl) * vpu;
    html += `<div class="lv"><span>L${i + 1}  ${p.toFixed(2)}</span><span>${lot.toFixed(2)}</span></div>`;
  }
  $("levels").innerHTML = html;
  $("sum").innerHTML = `${tot.toFixed(2)} lots · risk <b>${r.toFixed(0)}</b> (${(r / bal * 100).toFixed(1)}%)<br>
    <span class="mut">targets 0.3× / 0.7× / 1.2× the zone · full fill wins about ${(r * 1.95).toFixed(0)}</span>`;
}

function place() {
  const edge = parseFloat($("edge").value), sl = parseFloat($("sl").value), risk = +$("risk").value, n = +$("lay").value;
  if (!edge || !sl) return toast("fill in the zone first");
  cmd(`/grid layers ${n}`);
  setTimeout(() => cmd(`/grid ${edge} ${sl} ${risk}`, "preview sent to your chat"), 700);
}

function open_() {
  if (!S) return `<div class="row mut">No data yet.</div>`;
  let h = S.grid ? gridRow(S.grid) : `<div class="row mut">No grid running.</div>`;
  h += `<div class="row"><b>Everything open</b><br>${S.pos} positions · ${n2(S.lots)} lots · <span class="${cls(S.float)}">${sgn(S.float)}</span>
    <div class="btns b3">
      <button onclick="cmd('/be')">🛡 BE all</button>
      <button onclick="cmd('/derisk 50')">✂ Derisk</button>
      <button onclick="cmd('/c50')">◆ Bank 50%</button>
      <button onclick="cmd('/cancelorders')">🗑 Pendings</button>
      <button onclick="cmd('/book')">⚑ Book</button>
      <button class="dang" onclick="confirmCmd('/x','Close EVERY position?')">✖ Close all</button>
    </div></div>`;
  return h;
}

function stats() {
  return `<div class="row"><b>📊 Ask the EA</b>
    <div class="btns b2">
      <button onclick="cmd('/stats grid 30')">Grid stats 30d</button>
      <button onclick="cmd('/stats grid 90')">Grid stats 90d</button>
      <button onclick="cmd('/stats')">Account</button>
      <button onclick="cmd('/today')">Today</button>
      <button onclick="cmd('/week')">This week</button>
      <button onclick="cmd('/journal')">Journal</button>
    </div>
    <div class="mut" style="margin-top:8px;font-size:12px">Answers land in your Telegram chat, where they can be scrolled and searched.</div></div>
    ${S ? `<div class="kpis">
      <div class="kpi"><div class="l">Today</div><div class="v ${cls(S.day)}">${sgn(S.day)}</div></div>
      <div class="kpi"><div class="l">Week</div><div class="v ${cls(S.week)}">${sgn(S.week)}</div></div>
      <div class="kpi"><div class="l">Equity</div><div class="v">${n2(S.eq)}</div></div>
    </div>` : ""}`;
}

function settings() {
  const a = (S && S.auto) || {};
  const sw = (label, on, onCmd, offCmd) =>
    `<div class="sw"><span>${label}</span><span class="knob ${on ? "on" : ""}" onclick="cmd('${on ? offCmd : onCmd}')"><i></i></span></div>`;
  return sw("Auto break even", a.autobe, "/autobe on", "/autobe off") +
    sw("Trailing stop", a.trail, "/trail on", "/trail off") +
    sw("Guard (loss)", a.guard, "/guard on", "/guard off") +
    sw("Daily cut loss", a.cutloss, "/cl5", "/cutloss off") +
    sw("Quiet mode", a.quiet, "/quiet on", "/quiet off") +
    `<div class="row"><b>Grid</b>
      <div class="btns b3">
        <button onclick="cmd('/grid settings')">Settings</button>
        <button onclick="cmd('/grid order best')">Best first</button>
        <button onclick="cmd('/grid order worst')">Worst first</button>
        <button onclick="cmd('/grid sl net0')">SL net $0</button>
        <button onclick="cmd('/grid sl be')">SL break even</button>
        <button onclick="cmd('/help')">📖 Help</button>
      </div></div>
    <div class="row mut" style="font-size:12px">Everything here is the same command the chat bot takes, so the two never disagree.</div>
    <div class="row"><b>Connection</b>
      <div class="mut" style="font-size:12px;margin:4px 0 8px">${RELAY || "not set"}</div>
      <div class="btns b2">
        <button onclick="forgetSetup()">Change relay</button>
        <button onclick="pull()">Reconnect</button>
      </div></div>`;
}

const SCR = { home, new: newGrid, open: open_, stats, set: settings };

function render() {
  if (!RELAY || !KEY) { $("scr").innerHTML = setupScreen(); return; }
  $("scr").innerHTML = SCR[tab]();
  if (tab === "new") calc();
}
function go(t) {
  tab = t;
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.t === t));
  render();
}
document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => go(b.dataset.t)));

pull();
setInterval(pull, 2000);
</script>
</body>
</html>
